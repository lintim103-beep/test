<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
    /* ---------- Base Layout ---------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        background:#1e1e24; /* 已修改：深色背景 */
        color:#e0e0e0; /* 已修改：淺色文字 */
        line-height:1.6;padding:20px;
    }
    /* 放大整體頁面最大寬度，確保 3 個卡片橫排時有足夠空間 */
    .container{max-width:1000px;margin:0 auto;}

    /* ---------- Header ---------- */
    header{
        padding:40px 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 30px;
    }
    
    .headshot-container{
        position:relative;
        width:150px;
        height:auto;
        min-height:120px;
        flex-shrink: 0;
        border-radius:10px;
        background:#2a2b36;display:flex;
        align-items:center;justify-content:center;overflow:hidden;
        box-shadow:0 4px 12px rgba(0,0,0,.4);cursor:pointer;
    }
    .headshot-placeholder{
        width:100%;height:100%;background:#2980b9;
        border-radius:10px;
        display:flex;align-items:center;justify-content:center;
    }
    .headshot-placeholder-text{
        font-size:1.2rem;
        font-weight:bold;
        color:#fff;
        text-shadow:1px 1px 2px rgba(0,0,0,.3);
        text-align: center;
        padding: 10px;
    }
    #headshotImg{
        width:100%;height:100%;object-fit:cover;display:none;
    }

    /* 自我介紹輸入框樣式 */
    .intro-input {
        flex: 1;
        font-size: 1.2rem;
        color: #e0e0e0; /* 已修改：輸入文字淺色 */
        text-align: left;
        border: 2px dashed #4a5568; /* 已修改：虛線邊框暗色 */
        background: #2a2b36; /* 已修改：背景改深色 */
        padding: 15px;
        min-height: 120px;
        resize: vertical;
    }
    .intro-input::placeholder {
        color: #a0aec0;
    }
    .intro-input:focus {
        border-style: solid;
        border-color: #3498db;
    }

    @media(max-width:768px){
        header {
            flex-direction: column;
            text-align: center;
        }
        .headshot-container {
            width: 100%;
            height: 150px;
        }
        .intro-input {
            width: 100%;
            text-align: center;
        }
    }

    /* ---------- Projects ---------- */
    .projects-container{
        max-width:1000px;margin:60px auto;padding:0;
    }
    .section-title{
        text-align:center;font-size:2.5rem;margin-bottom:50px;
        color:#f0f4f8; /* 已修改：亮色標題 */
    }
    .projects-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:20px;
        width:100%;
        margin:0 auto;
    }
    .project-card{
        background:#2a2b36; /* 已修改：卡片背景深色 */
        padding:25px;border-radius:10px;
        box-shadow:0 4px 15px rgba(0,0,0,.3);
        transition:transform .3s,box-shadow .3s;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .project-card:hover{
        transform:translateY(-5px);
        box-shadow:0 8px 25px rgba(0,0,0,.5);
    }
    
    /* 專案卡片內的填空框樣式 */
    .project-title-input {
        font-size: 1.25rem !important;
        font-weight: bold;
        color: #63b3ed !important; /* 已修改：亮藍色標題 */
    }
    .project-desc-input {
        resize: vertical;
        min-height: 100px;
        color: #cbd5e0;
    }
    .project-link-input {
        font-size: 0.9rem !important;
        color: #a0aec0;
    }

    /* 手機等窄螢幕時自動改為單欄，避免被壓得太窄 */
    @media(max-width:768px){
        .projects-grid{grid-template-columns:1fr;}
        .section-title{font-size:2rem;}
    }

    /* ---------- Contact ---------- */
    .contact-section{
        max-width:1000px;
        margin:60px auto 0 auto;
        padding:0;
    }
    .contact-title{
        text-align:center;font-size:1.8rem;margin-bottom:30px;
        color:#f0f4f8; /* 已修改：亮色標題 */
    }
    .contact-grid{
        display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
        padding:30px;
        background:#2a2b36; /* 已修改：表單背景深色 */
        border-radius:10px;
        box-shadow:0 4px 12px rgba(0,0,0,.3);
    }
    @media(max-width:768px){.contact-grid{grid-template-columns:1fr;}}

    input,textarea{
        width:100%;padding:12px 15px;
        border:2px solid #3f4452; /* 已修改：輸入框暗邊框 */
        background:#1e1e24; /* 已修改：輸入框暗底色 */
        color:#e0e0e0; /* 已修改：輸入文字淺色 */
        border-radius:10px;
        font-family:inherit;font-size:1rem;transition:all .3s;
    }
    input::placeholder, textarea::placeholder{
        color: #718096; /* 已修改：提示字顏色 */
    }
    input:focus,textarea:focus{border-color:#3498db;outline:none;}

    .submit-btn{
        background:#3498db;color:#fff;
        padding:14px 32px;border:none;border-radius:30px;
        font-size:1.1rem;font-weight:600;cursor:pointer;
        box-shadow:0 5px 15px rgba(52,152,219,.3);
        transition:all .3s;
    }
    .submit-btn:hover{
        background:#2980b9;transform:translateY(-2px);
    }
</style>
</head>
<body>
<div class="container">
    <header>
        <div class="headshot-container">
            <input type="file" id="headshotInput" accept="image/*" style="display:none;">
            <div class="headshot-placeholder">
                <img id="headshotImg" src="" alt="Headshot">
                <div id="placeholderText" class="headshot-placeholder-text">Upload Your Photo</div>
            </div>
        </div>

        <textarea class="intro-input" placeholder="請輸入自我介紹"></textarea>
    </header>

    <section class="projects-container">
        <h2 class="section-title">作品集</h2>
        <div class="projects-grid">
            
            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

        </div>
    </section>

    <section class="contact-section">
        <h2 class="contact-title">聯絡我</h2>
        <form id="contactForm">
            <div class="contact-grid">
                <input type="text" id="name" placeholder="姓名" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" rows="4" placeholder="留言" required></textarea>
                <button type="submit" class="submit-btn">送出</button>
            </div>
        </form>
    </section>
</div>

<script>
    // Headshot upload preview
    const headshotInput = document.getElementById('headshotInput');
    const headshotImg = document.getElementById('headshotImg');
    const placeholderText = document.getElementById('placeholderText');
    const headshotContainer = document.querySelector('.headshot-container');

    // Click container to trigger file input
    headshotContainer.addEventListener('click', () => {
        headshotInput.click();
    });

    // When file selected, preview
    headshotInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                headshotImg.src = event.target.result;
                headshotImg.style.display = 'block';
                placeholderText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    // 表單提交處理
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault(); // 防止表單重整

        // 顯示成功提示
        alert('留言已成功送出！');

        // 清空表單欄位
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('message').value = '';

        // 聚焦到姓名欄位（視覺上清空後的回饋）
        document.getElementById('name').focus();
    });
</script>
</body>
</html>
