<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
    /* ---------- Base Layout (Light Mode) ---------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        background:#f5f7fa;
        color:#333;
        line-height:1.6;
        padding:20px;
        transition: background-color 0.4s ease, color 0.4s ease;
        cursor: pointer; /* 提示使用者背景可點擊 */
    }
    .container{max-width:1000px;margin:0 auto;}

    /* 右上角主題切換提示按鈕 */
    .theme-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: rgba(52, 152, 219, 0.2);
        color: #3498db;
        border: 1px solid #3498db;
        padding: 8px 16px;
        border-radius: 20px;
        font-size: 0.9rem;
        font-weight: bold;
        cursor: pointer;
        transition: all 0.3s;
        z-index: 1000;
    }
    .theme-toggle-btn:hover {
        background: #3498db;
        color: #fff;
    }

    /* ---------- Header ---------- */
    header{
        padding:40px 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 30px;
    }
    
    .headshot-container{
        position:relative;
        width:150px;
        height:auto;
        min-height:120px;
        flex-shrink: 0;
        border-radius:10px;
        background:#ddd;display:flex;
        align-items:center;justify-content:center;overflow:hidden;
        box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer;
        transition: background-color 0.4s ease;
    }
    .headshot-placeholder{
        width:100%;height:100%;background:#3498db;
        border-radius:10px;
        display:flex;align-items:center;justify-content:center;
    }
    .headshot-placeholder-text{
        font-size:1.2rem;
        font-weight:bold;
        color:#fff;
        text-shadow:1px 1px 2px rgba(0,0,0,.3);
        text-align: center;
        padding: 10px;
    }
    #headshotImg{
        width:100%;height:100%;object-fit:cover;display:none;
    }

    /* 自我介紹輸入框樣式 */
    .intro-input {
        flex: 1;
        font-size: 1.2rem;
        color: #34495e;
        text-align: left;
        border: 2px dashed #cbd5e1;
        background: #ffffff;
        padding: 15px;
        min-height: 120px;
        resize: vertical;
        cursor: text;
        transition: all 0.4s ease;
    }
    .intro-input:focus {
        border-style: solid;
        border-color: #3498db;
    }

    @media(max-width:768px){
        header {
            flex-direction: column;
            text-align: center;
        }
        .headshot-container {
            width: 100%;
            height: 150px;
        }
        .intro-input {
            width: 100%;
            text-align: center;
        }
    }

    /* ---------- Projects ---------- */
    .projects-container{
        max-width:1000px;margin:60px auto;padding:0;
    }
    .section-title{
        text-align:center;font-size:2.5rem;margin-bottom:50px;color:#2c3e50;
        transition: color 0.4s ease;
    }
    .projects-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:20px;
        width:100%;
        margin:0 auto;
    }
    .project-card{
        background:#fff;padding:25px;border-radius:10px;
        box-shadow:0 4px 15px rgba(0,0,0,.1);
        transition:transform .3s, box-shadow .3s, background-color 0.4s ease;
        display: flex;
        flex-direction: column;
        gap: 12px;
        cursor: default;
    }
    .project-card:hover{
        transform:translateY(-5px);
        box-shadow:0 8px 25px rgba(0,0,0,.15);
    }
    
    .project-title-input {
        font-size: 1.25rem !important;
        font-weight: bold;
        color: #3498db !important;
    }
    .project-desc-input {
        resize: vertical;
        min-height: 100px;
        color: #555;
    }
    .project-link-input {
        font-size: 0.9rem !important;
        color: #7f8c8d;
    }

    @media(max-width:768px){
        .projects-grid{grid-template-columns:1fr;}
        .section-title{font-size:2rem;}
    }

    /* ---------- Contact ---------- */
    .contact-section{
        max-width:1000px;
        margin:60px auto 0 auto;
        padding:0;
    }
    .contact-title{
        text-align:center;font-size:1.8rem;margin-bottom:30px;color:#2c3e50;
        transition: color 0.4s ease;
    }
    .contact-grid{
        display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
        padding:30px;background:#fff;border-radius:10px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        transition: background-color 0.4s ease;
        cursor: default;
    }
    @media(max-width:768px){.contact-grid{grid-template-columns:1fr;}}

    input,textarea{
        width:100%;padding:12px 15px;border:2px solid #ddd;border-radius:10px;
        font-family:inherit;font-size:1rem;transition:all .3s;
        cursor: text;
    }
    input:focus,textarea:focus{border-color:#3498db;outline:none;}

    .submit-btn{
        background:#3498db;color:#fff;
        padding:14px 32px;border:none;border-radius:30px;
        font-size:1.1rem;font-weight:600;cursor:pointer;
        box-shadow:0 5px 15px rgba(52,152,219,.3);
        transition:all .3s;
    }
    .submit-btn:hover{
        background:#2980b9;transform:translateY(-2px);
    }

    /* ==========================================
       ---------- Dark Mode Styles ----------
       ========================================== */
    body.dark-mode {
        background: #18181c;
        color: #e0e0e0;
    }
    body.dark-mode .theme-toggle-btn {
        background: rgba(99, 179, 237, 0.2);
        color: #63b3ed;
        border-color: #63b3ed;
    }
    body.dark-mode .section-title,
    body.dark-mode .contact-title {
        color: #f0f4f8;
    }
    body.dark-mode .project-card,
    body.dark-mode .contact-grid {
        background: #24252d;
        box-shadow: 0 4px 15px rgba(0,0,0,.4);
    }
    body.dark-mode .intro-input {
        background: #24252d;
        color: #e0e0e0;
        border-color: #4a5568;
    }
    body.dark-mode .intro-input::placeholder {
        color: #a0aec0;
    }
    body.dark-mode input,
    body.dark-mode textarea {
        background: #18181c;
        color: #e0e0e0;
        border-color: #3f4452;
    }
    body.dark-mode input::placeholder,
    body.dark-mode textarea::placeholder {
        color: #718096;
    }
    body.dark-mode .project-title-input {
        color: #63b3ed !important;
    }
    body.dark-mode .project-desc-input {
        color: #cbd5e0;
    }
    body.dark-mode .project-link-input {
        color: #a0aec0;
    }
</style>
</head>
<body>

<button class="theme-toggle-btn" id="themeToggleBtn">🌙 點擊空白處切換主題</button>

<div class="container">
    <header>
        <div class="headshot-container">
            <input type="file" id="headshotInput" accept="image/*" style="display:none;">
            <div class="headshot-placeholder">
                <img id="headshotImg" src="" alt="Headshot">
                <div id="placeholderText" class="headshot-placeholder-text">Upload Your Photo</div>
            </div>
        </div>

        <textarea class="intro-input" placeholder="請輸入自我介紹"></textarea>
    </header>

    <section class="projects-container">
        <h2 class="section-title">作品集</h2>
        <div class="projects-grid">
            
            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

        </div>
    </section>

    <section class="contact-section">
        <h2 class="contact-title">聯絡我</h2>
        <form id="contactForm">
            <div class="contact-grid">
                <input type="text" id="name" placeholder="姓名" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" rows="4" placeholder="留言" required></textarea>
                <button type="submit" class="submit-btn">送出</button>
            </div>
        </form>
    </section>
</div>

<script>
    // 切換深色/淺色主題模式
    function toggleTheme() {
        document.body.classList.toggle('dark-mode');
        const btn = document.getElementById('themeToggleBtn');
        if (document.body.classList.contains('dark-mode')) {
            btn.innerHTML = '☀️ 點擊空白處切換主題';
        } else {
            btn.innerHTML = '🌙 點擊空白處切換主題';
        }
    }

    // 點擊全域事件：只在點擊空白背景時觸發主題切換
    document.addEventListener('click', function(e) {
        // 如果點擊的是輸入框、按鈕或頭貼區塊，則不觸發背景切換
        const interactiveElements = ['INPUT', 'TEXTAREA', 'BUTTON', 'LABEL'];
        const isInteractive = interactiveElements.includes(e.target.tagName) || 
                              e.target.closest('.headshot-container') ||
                              e.target.closest('.project-card') ||
                              e.target.closest('.contact-grid');

        // 當點擊的是提示按鈕時直接切換
        if (e.target.id === 'themeToggleBtn') {
            toggleTheme();
            return;
        }

        // 點擊空白背景時切換
        if (!isInteractive) {
            toggleTheme();
        }
    });

    // Headshot upload preview
    const headshotInput = document.getElementById('headshotInput');
    const headshotImg = document.getElementById('headshotImg');
    const placeholderText = document.getElementById('placeholderText');
    const headshotContainer = document.querySelector('.headshot-container');

    headshotContainer.addEventListener('click', () => {
        headshotInput.click();
    });

    headshotInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                headshotImg.src = event.target.result;
                headshotImg.style.display = 'block';
                placeholderText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    // 表單提交處理
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('留言已成功送出！');
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('message').value = '';
        document.getElementById('name').focus();
    });
</script>
</body>
</html>
