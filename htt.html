<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Portfolio</title>
<style>
    /* ---------- Base Layout ---------- */
    *{margin:0;padding:0;box-sizing:border-box;}
    body{
        font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;
        background:#f5f7fa;color:#333;line-height:1.6;padding:20px;
        transition: background-color 0.4s ease, color 0.4s ease;
    }
    .container{max-width:1000px;margin:0 auto;}

    /* ---------- 切換深淺色按鈕 ---------- */
    .theme-toggle-btn {
        position: fixed;
        top: 20px;
        right: 20px;
        background: #ffffff;
        color: #2c3e50;
        border: 2px solid #cbd5e1;
        padding: 8px 16px;
        border-radius: 30px;
        font-size: 0.9rem;
        font-weight: 600;
        cursor: pointer;
        box-shadow: 0 4px 12px rgba(0,0,0,.1);
        transition: all 0.3s ease;
        z-index: 1000;
        display: flex;
        align-items: center;
        gap: 6px;
    }
    .theme-toggle-btn:hover {
        transform: translateY(-2px);
        box-shadow: 0 6px 16px rgba(0,0,0,.15);
        border-color: #3498db;
    }

    /* ---------- Header ---------- */
    header{
        padding:40px 0;
        display: flex;
        align-items: stretch;
        justify-content: center;
        gap: 30px;
    }
    
    .headshot-container{
        position:relative;
        width:150px;
        height:auto;
        min-height:120px;
        flex-shrink: 0;
        border-radius:10px;
        background:#ddd;display:flex;
        align-items:center;justify-content:center;overflow:hidden;
        box-shadow:0 4px 12px rgba(0,0,0,.1);cursor:pointer;
        transition: background-color 0.4s ease;
    }
    .headshot-placeholder{
        width:100%;height:100%;background:#3498db;
        border-radius:10px;
        display:flex;align-items:center;justify-content:center;
    }
    .headshot-placeholder-text{
        font-size:1.2rem;
        font-weight:bold;
        color:#fff;
        text-shadow:1px 1px 2px rgba(0,0,0,.3);
        text-align: center;
        padding: 10px;
    }
    #headshotImg{
        width:100%;height:100%;object-fit:cover;display:none;
    }

    /* 自我介紹輸入框樣式 */
    .intro-input {
        flex: 1;
        font-size: 1.1rem;
        color: #34495e;
        text-align: left;
        border: 2px dashed #cbd5e1;
        background: #ffffff;
        padding: 15px;
        min-height: 120px;
        resize: vertical;
        transition: all 0.4s ease;
    }
    .intro-input:focus {
        border-style: solid;
        border-color: #3498db;
    }

    /* ---------- Projects ---------- */
    .projects-container{
        max-width:1000px;margin:60px auto;padding:0;
    }
    .section-title{
        text-align:center;font-size:2.2rem;margin-bottom:40px;color:#2c3e50;
        transition: color 0.4s ease;
    }
    .projects-grid{
        display:grid;
        grid-template-columns: repeat(3, 1fr);
        gap:20px;
        width:100%;
        margin:0 auto;
    }
    .project-card{
        background:#fff;padding:25px;border-radius:10px;
        box-shadow:0 4px 15px rgba(0,0,0,.1);
        transition:transform .3s, box-shadow .3s, background-color 0.4s ease;
        display: flex;
        flex-direction: column;
        gap: 12px;
    }
    .project-card:hover{
        transform:translateY(-5px);
        box-shadow:0 8px 25px rgba(0,0,0,.15);
    }
    
    .project-title-input {
        font-size: 1.25rem !important;
        font-weight: bold;
        color: #3498db !important;
    }
    .project-desc-input {
        resize: vertical;
        min-height: 100px;
        color: #555;
    }
    .project-link-input {
        font-size: 0.9rem !important;
        color: #7f8c8d;
    }

    /* ---------- Contact ---------- */
    .contact-section{
        max-width:1000px;
        margin:60px auto 0 auto;
        padding:0;
    }
    .contact-title{
        text-align:center;font-size:2.2rem;margin-bottom:30px;color:#2c3e50;
        transition: color 0.4s ease;
    }
    .contact-grid{
        display:grid;grid-template-columns:repeat(4,1fr);gap:15px;
        padding:30px;background:#fff;border-radius:10px;
        box-shadow:0 4px 12px rgba(0,0,0,.08);
        transition: background-color 0.4s ease;
    }

    input,textarea{
        width:100%;padding:12px 15px;border:2px solid #ddd;border-radius:10px;
        font-family:inherit;font-size:1rem;transition:all .3s;
    }
    input:focus,textarea:focus{border-color:#3498db;outline:none;}

    .submit-btn{
        background:#3498db;color:#fff;
        padding:14px 32px;border:none;border-radius:30px;
        font-size:1.1rem;font-weight:600;cursor:pointer;
        box-shadow:0 5px 15px rgba(52,152,219,.3);
        transition:all .3s;
    }
    .submit-btn:hover{
        background:#2980b9;transform:translateY(-2px);
    }

    /* ==========================================
       📱 手機版專屬優化 (Mobile RWD)
       ========================================== */
    @media(max-width:768px){
        body {
            padding: 15px 12px;
        }
        .theme-toggle-btn {
            top: 12px;
            right: 12px;
            padding: 6px 12px;
            font-size: 0.8rem;
        }
        header {
            flex-direction: column;
            align-items: center;
            gap: 20px;
            padding: 20px 0;
        }
        .headshot-container {
            width: 130px;
            height: 130px;
            border-radius: 50%; /* 手機版改圓形大頭貼更美觀 */
        }
        .intro-input {
            width: 100%;
            text-align: left;
            min-height: 100px;
            font-size: 1rem;
        }
        .projects-container, .contact-section {
            margin: 40px auto 0 auto;
        }
        .section-title, .contact-title {
            font-size: 1.6rem;
            margin-bottom: 24px;
        }
        .projects-grid {
            grid-template-columns: 1fr;
            gap: 16px;
        }
        .project-card {
            padding: 18px;
        }
        .contact-grid {
            grid-template-columns: 1fr;
            padding: 20px 15px;
            gap: 12px;
        }
        .submit-btn {
            width: 100%; /* 手機版按鈕滿版更好按 */
            padding: 12px 0;
        }
    }

    /* ==========================================
       ---------- 深色模式樣式 (Dark Mode) ----------
       ========================================== */
    body.dark-mode {
        background: #18181c;
        color: #e0e0e0;
    }
    body.dark-mode .theme-toggle-btn {
        background: #2a2b36;
        color: #f0f4f8;
        border-color: #4a5568;
        box-shadow: 0 4px 12px rgba(0,0,0,.4);
    }
    body.dark-mode .section-title,
    body.dark-mode .contact-title {
        color: #f0f4f8;
    }
    body.dark-mode .project-card,
    body.dark-mode .contact-grid {
        background: #24252d;
        box-shadow: 0 4px 15px rgba(0,0,0,.4);
    }
    body.dark-mode .intro-input {
        background: #24252d;
        color: #e0e0e0;
        border-color: #4a5568;
    }
    body.dark-mode .intro-input::placeholder {
        color: #a0aec0;
    }
    body.dark-mode input,
    body.dark-mode textarea {
        background: #18181c;
        color: #e0e0e0;
        border-color: #3f4452;
    }
    body.dark-mode input::placeholder,
    body.dark-mode textarea::placeholder {
        color: #718096;
    }
    body.dark-mode .project-title-input {
        color: #63b3ed !important;
    }
    body.dark-mode .project-desc-input {
        color: #cbd5e0;
    }
    body.dark-mode .project-link-input {
        color: #a0aec0;
    }
</style>
</head>
<body>

<!-- 深淺色切換按鈕 -->
<button class="theme-toggle-btn" id="themeToggleBtn">
    <span>🌙</span> 深色模式
</button>

<div class="container">
    <header>
        <div class="headshot-container">
            <input type="file" id="headshotInput" accept="image/*" style="display:none;">
            <div class="headshot-placeholder">
                <img id="headshotImg" src="" alt="Headshot">
                <div id="placeholderText" class="headshot-placeholder-text">Upload Photo</div>
            </div>
        </div>

        <textarea class="intro-input" placeholder="請輸入自我介紹"></textarea>
    </header>

    <section class="projects-container">
        <h2 class="section-title">作品集</h2>
        <div class="projects-grid">
            
            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

            <div class="project-card">
                <input type="text" class="project-title-input" placeholder="請輸入專案名稱">
                <textarea class="project-desc-input" placeholder="請輸入專案描述"></textarea>
                <input type="url" class="project-link-input" placeholder="請輸入專案連結 (例：https://...)">
            </div>

        </div>
    </section>

    <section class="contact-section">
        <h2 class="contact-title">聯絡我</h2>
        <form id="contactForm">
            <div class="contact-grid">
                <input type="text" id="name" placeholder="姓名" required>
                <input type="email" id="email" placeholder="Email" required>
                <textarea id="message" rows="4" placeholder="留言" required></textarea>
                <button type="submit" class="submit-btn">送出</button>
            </div>
        </form>
    </section>
</div>

<script>
    // 深淺色模式切換邏輯
    const themeToggleBtn = document.getElementById('themeToggleBtn');
    
    themeToggleBtn.addEventListener('click', () => {
        document.body.classList.toggle('dark-mode');
        
        if (document.body.classList.contains('dark-mode')) {
            themeToggleBtn.innerHTML = '<span>☀️</span> 淺色模式';
        } else {
            themeToggleBtn.innerHTML = '<span>🌙</span> 深色模式';
        }
    });

    // Headshot upload preview
    const headshotInput = document.getElementById('headshotInput');
    const headshotImg = document.getElementById('headshotImg');
    const placeholderText = document.getElementById('placeholderText');
    const headshotContainer = document.querySelector('.headshot-container');

    headshotContainer.addEventListener('click', () => {
        headshotInput.click();
    });

    headshotInput.addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (file) {
            const reader = new FileReader();
            reader.onload = function(event) {
                headshotImg.src = event.target.result;
                headshotImg.style.display = 'block';
                placeholderText.style.display = 'none';
            };
            reader.readAsDataURL(file);
        }
    });

    // 表單提交處理
    document.getElementById('contactForm').addEventListener('submit', function(e) {
        e.preventDefault();
        alert('留言已成功送出！');
        document.getElementById('name').value = '';
        document.getElementById('email').value = '';
        document.getElementById('message').value = '';
        document.getElementById('name').focus();
    });
</script>
</body>
</html>
